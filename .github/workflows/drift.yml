name: drift

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      repos: ${{ steps.check.outputs.repos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: watched
        run: echo "names=$(jq -r '[.[] | select((.watch // "") != "") | .repo] | join(",")' repos.json)" >> "$GITHUB_OUTPUT"

      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.watched.outputs.names }}
          permission-contents: read

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - id: check
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          drifted() {
            local dir=$1 attr=$2 locked latest cmp
            locked=$(nix eval --raw --inputs-from "$dir" "nixpkgs#$attr.version") || return 2
            latest=$(nix eval --raw "https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz#$attr.version") || return 2
            echo "$attr: locked=$locked upstream=$latest" >&2
            cmp=$(nix eval --expr "builtins.compareVersions \"$locked\" \"$latest\"") || return 2
            [ "$cmp" -lt 0 ]
          }

          due=()
          failed=()
          while read -r entry; do
            repo=$(jq -r .repo <<< "$entry")
            watch=$(jq -r .watch <<< "$entry")
            echo "== $repo"
            if ! git clone -q --depth 1 "https://x-access-token:$TOKEN@github.com/$OWNER/$repo" "checkout-$repo"; then
              echo "::error::could not clone $repo"
              failed+=("$repo")
              continue
            fi
            for attr in $watch; do
              rc=0
              drifted "$PWD/checkout-$repo" "$attr" || rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "::error::could not check $attr in $repo"
                failed+=("$repo")
                break
              elif [ "$rc" -eq 0 ] || [ "$DRY_RUN" = true ]; then
                due+=("$repo")
                break
              fi
            done
          done < <(jq -c '.[] | select((.watch // "") != "")' repos.json)

          echo "repos=$(jq -nc '$ARGS.positional' --args "${due[@]}")" >> "$GITHUB_OUTPUT"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::drift check failed for: ${failed[*]}"
            exit 1
          fi

  update:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.repos != '' && needs.check.outputs.repos != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.check.outputs.repos) }}
    uses: ./.github/workflows/update.yml
    with:
      repo: ${{ matrix.repo }}
      inputs: nixpkgs
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
